name: Deploy to Firebase Hosting on merge to main

on:
  push:
    branches:
      - main

concurrency:
  group: hosting-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Deploy to Firebase Hosting (shinme-demo)
        run: npx firebase-tools deploy --only hosting:shinme-demo --token "${{ secrets.FIREBASE_TOKEN }}"
